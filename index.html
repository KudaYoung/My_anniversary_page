<body>
    <div class="bg-blob blob-1"></div>
    <div class="bg-blob blob-2"></div>

    <div class="container">
        <header class="fade-in">
            <div class="header-card">
                <h1 class="handwriting">我们的纪念日</h1>
                <p class="subtitle">斯人若彩虹，遇上方知有</p>
                <div class="date-tag">
                    <span id="start-date-display">Computing...</span>
                </div>
            </div>
        </header>
        
        <section class="counter-section fade-in">
            <p class="counter-label">我们已经相爱了</p>
            <div class="days-wrapper">
                <span class="days-number" id="days-counter">0</span>
                <span class="days-unit">天</span>
            </div>
            <p class="counter-footer">每一秒都值得被记录</p>
        </section>
        
        <section class="timeline-section">
            <h2 class="section-title handwriting fade-in">时光相册</h2>
            <div class="timeline" id="timeline">
                </div>
            
            <div class="more-photos-section fade-in">
                <p>未完待续...</p>
                <a href="gallery" class="more-btn">查看更多回忆 <span class="arrow">→</span></a>
            </div>
        </section>
        
        <footer class="fade-in">
            <p>
                Love & Memory @ <span id="current-year"></span>
                <br>
                <a href="https://github.com/KudaYoung" target="_blank" class="github-link">
                    Designed by KudaYoung
                </a>
            </p>
        </footer>
    </div>

    <script src="js/script.js"></script>
